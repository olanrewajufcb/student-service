apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/emis-infra.git
    targetRevision: main
    path: student-service/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: student

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
